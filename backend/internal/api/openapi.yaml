components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GreetingMessageBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/GreetingMessageBody.json
          format: uri
          readOnly: true
          type: string
        greeting:
          description: Greeting message
          examples:
            - Hello, world!
          type: string
      required:
        - greeting
      type: object
    GreetingRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/GreetingRequestBody.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Name to greet
          examples:
            - world
          maxLength: 30
          type: string
      required:
        - name
      type: object
info:
  contact:
    name: Inspirate Consulting Team
  description: API for the Inspirate Consulting application
  title: Inspirate Consulting API
  version: 1.0.0
openapi: 3.1.0
paths:
  /greeting:
    post:
      description: Create a greeting for a person by name.
      operationId: create-greeting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GreetingRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GreetingMessageBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - Greetings
servers:
  - description: Local development server
    url: http://localhost:8080
