components:
  schemas:
    CreateExtracurricularRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/CreateExtracurricularRequest.json
          format: uri
          readOnly: true
          type: string
        description:
          type: string
        end_date:
          format: date
          type: string
        leadership_role:
          type: string
        name:
          minLength: 1
          type: string
        organization:
          type: string
        start_date:
          format: date
          type: string
        status:
          enum:
            - doing
            - have_done
          type: string
        type:
          enum:
            - maintenance
            - investment
          type: string
      required:
        - name
        - status
        - type
        - description
        - start_date
        - organization
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Extracurricular:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/Extracurricular.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        description:
          type: string
        end_date:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        leadership_role:
          type: string
        name:
          type: string
        organization:
          type: string
        start_date:
          format: date-time
          type: string
        status:
          type: string
        student_id:
          type: string
        type:
          type: string
        updated_at:
          format: date-time
          type: string
        user_id:
          type: string
      required:
        - id
        - created_at
        - updated_at
        - student_id
        - user_id
        - name
        - status
        - type
        - description
        - start_date
        - organization
      type: object
    GreetingMessageBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/GreetingMessageBody.json
          format: uri
          readOnly: true
          type: string
        greeting:
          description: Greeting message
          examples:
            - Hello, world!
          type: string
      required:
        - greeting
      type: object
    GreetingRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/GreetingRequestBody.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Name to greet
          examples:
            - world
          maxLength: 30
          type: string
      required:
        - name
      type: object
    UpdateExtracurricularRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/UpdateExtracurricularRequest.json
          format: uri
          readOnly: true
          type: string
        description:
          type: string
        end_date:
          format: date
          type: string
        leadership_role:
          type: string
        name:
          minLength: 1
          type: string
        organization:
          type: string
        start_date:
          format: date
          type: string
        status:
          enum:
            - doing
            - have_done
          type: string
        type:
          enum:
            - maintenance
            - investment
          type: string
      type: object
info:
  contact:
    name: Inspirate Consulting Team
  description: API for the Inspirate Consulting application
  title: Inspirate Consulting API
  version: 1.0.0
openapi: 3.1.0
paths:
  /extracurriculars:
    get:
      description: List extracurriculars for the authenticated student.
      operationId: list-extracurriculars
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Extracurricular"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - Extracurriculars
  /extracurriculars/{id}:
    patch:
      description: Update fields on an extracurricular for the authenticated student.
      operationId: update-extracurricular
      parameters:
        - description: ID of the extracurricular to update
          in: path
          name: id
          required: true
          schema:
            description: ID of the extracurricular to update
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExtracurricularRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extracurricular"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - Extracurriculars
  /extracurriculars/{studentID}:
    post:
      description: Create a new extracurricular for the given student.
      operationId: create-extracurricular
      parameters:
        - description: ID of the student the extracurricular belongs to
          in: path
          name: studentID
          required: true
          schema:
            description: ID of the student the extracurricular belongs to
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExtracurricularRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extracurricular"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - Extracurriculars
  /greeting:
    post:
      description: Create a greeting for a person by name.
      operationId: create-greeting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GreetingRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GreetingMessageBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - Greetings
servers:
  - description: Local development server
    url: http://localhost:8080
