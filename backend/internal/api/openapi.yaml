components:
  schemas:
    CreateEssayBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/CreateEssayBody.json
          format: uri
          readOnly: true
          type: string
        college_id:
          description: Optional college this essay targets
          format: int64
          type:
            - integer
            - "null"
        essay_group_id:
          description: optional group this essay belongs to
          type: string
        link_to_content:
          examples:
            - https://docs.google.com/document/d/abc123
          minLength: 10
          type: string
        student_id:
          description: Student the essay belongs to
          type: string
        type:
          examples:
            - personal-statement
          maxLength: 100
          type: string
      required:
        - student_id
        - type
        - link_to_content
      type: object
    CreateGlobalCollegeRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/CreateGlobalCollegeRequestBody.json
          format: uri
          readOnly: true
          type: string
        ea_deadline:
          description: Early admission deadline
          examples:
            - "2023-01-01T00:00:00Z"
          format: date-time
          type: string
        ed_deadline:
          description: Early decision deadline
          examples:
            - "2023-01-01T00:00:00Z"
          format: date-time
          type: string
        rd_deadline:
          description: Regular decision deadline
          examples:
            - "2023-01-01T00:00:00Z"
          format: date-time
          type: string
        school_location:
          description: Location of the college
          examples:
            - Cambridge, MA
          type: string
        school_name:
          description: Name of the college
          examples:
            - Harvard University
          type: string
      required:
        - school_name
        - school_location
      type: object
    CreatePersonalCollegeApplicationRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/CreatePersonalCollegeApplicationRequestBody.json
          format: uri
          readOnly: true
          type: string
        application_type:
          description: Which deadline the student is applying by
          enum:
            - EA
            - ED
            - RD
          type: string
        category:
          description: How the student categorizes this school
          enum:
            - safety
            - target
            - reach
          type: string
        global_college_id:
          description: ID of the global college being applied to
          format: int64
          type: integer
      required:
        - global_college_id
        - application_type
        - category
      type: object
    CreateTodoItemRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/CreateTodoItemRequestBody.json
          format: uri
          readOnly: true
          type: string
        completed_at:
          format: date-time
          type: string
        deadline:
          format: date-time
          type: string
        student_id:
          type: string
        todo_description:
          type: string
        user_id:
          type: string
      required:
        - todo_description
      type: object
    CreateUserInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/CreateUserInputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: email of user for supabase signup
          type: string
        name:
          description: Name of the user
          maxLength: 200
          minLength: 1
          type: string
        password:
          description: password of user for supabase signup
          type: string
        pfp_key:
          description: pfp key of user
          type:
            - string
            - "null"
      required:
        - name
        - pfp_key
        - email
        - password
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8081/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    EssayListBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/EssayListBody.json
          format: uri
          readOnly: true
          type: string
        essays:
          items:
            $ref: "#/components/schemas/Essays"
          type:
            - array
            - "null"
      required:
        - essays
      type: object
    EssayReviewStatus:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/EssayReviewStatus.json
          format: uri
          readOnly: true
          type: string
        completed_at:
          description: When a counselor completed it
          examples:
            - "2026-01-01T00:00:00Z"
          format: date-time
          type: string
        essay_id:
          description: Essay the review is for
          examples:
            - b2c3d4e5-f6a7-4859-9a0b-1c2d3e4f5a6b
          type: string
        requested_at:
          description: When the review was requested
          examples:
            - "2026-01-01T00:00:00Z"
          format: date-time
          type: string
        status:
          description: open, completed, or refunded
          examples:
            - open
          type: string
        student_id:
          description: Student who requested the review
          examples:
            - 3f2b1a0c-9d8e-4c7b-8a6f-5e4d3c2b1a09
          type: string
        transaction_id:
          description: Ledger row this status came from
          examples:
            - 7a1f0c9e-0b4e-4f1a-9f2d-0c3b5a6d7e8f
          type: string
      required:
        - transaction_id
        - essay_id
        - student_id
        - status
        - requested_at
      type: object
    EssayReviewTransaction:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/EssayReviewTransaction.json
          format: uri
          readOnly: true
          type: string
        actor_id:
          description: User who caused the movement. Null until auth provides the caller.
          examples:
            - d4e5f6a7-b8c9-4a71-bc2d-3e4f5a6b7c8d
          type: string
        completed_at:
          description: When a counselor marked the review complete
          examples:
            - "2026-01-01T00:00:00Z"
          format: date-time
          type: string
        created_at:
          description: Timestamp when the transaction was created
          examples:
            - "2026-01-01T00:00:00Z"
          format: date-time
          type: string
        entry_type:
          description: "Kind of movement: spend, refund, or adjustment"
          examples:
            - spend
          type: string
        essay_id:
          description: Essay under review. Null for an adjustment.
          examples:
            - b2c3d4e5-f6a7-4859-9a0b-1c2d3e4f5a6b
          type: string
        id:
          description: Unique identifier for the transaction
          examples:
            - 7a1f0c9e-0b4e-4f1a-9f2d-0c3b5a6d7e8f
          type: string
        refund:
          description: The negative row that reversed this charge, if it was refunded
          examples:
            - c3d4e5f6-a7b8-4960-ab1c-2d3e4f5a6b7c
          type: string
        status:
          description: "Lifecycle of a spend: open, completed, or refunded. Null for refund and adjustment rows."
          examples:
            - open
          type: string
        student_id:
          description: Student whose balance moved
          examples:
            - 3f2b1a0c-9d8e-4c7b-8a6f-5e4d3c2b1a09
          type: string
        subtotal:
          description: Signed change to the student's balance. Negative for a spend, positive for a refund or grant. Sums to the balance.
          examples:
            - -1
          format: int64
          type: integer
        updated_at:
          description: Timestamp when the transaction was last updated
          examples:
            - "2026-01-01T00:00:00Z"
          format: date-time
          type: string
      required:
        - id
        - subtotal
        - student_id
        - entry_type
        - created_at
        - updated_at
      type: object
    Essays:
      additionalProperties: false
      properties:
        college_id:
          format: int64
          type:
            - integer
            - "null"
        essay_group_id:
          type: string
        id:
          type: string
        link_to_content:
          type: string
        status:
          type: string
        student_id:
          type: string
        type:
          type: string
      required:
        - id
        - student_id
        - type
        - college_id
        - link_to_content
        - status
        - essay_group_id
      type: object
    GlobalCollege:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/GlobalCollege.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: Timestamp when the college was created
          examples:
            - "2023-01-01T00:00:00Z"
          format: date-time
          type: string
        ea_deadline:
          description: Early admission deadline
          examples:
            - "2023-01-01T00:00:00Z"
          format: date-time
          type: string
        ed_deadline:
          description: Early decision deadline
          examples:
            - "2023-01-01T00:00:00Z"
          format: date-time
          type: string
        id:
          description: Unique identifier for the college
          examples:
            - 1
          format: int64
          type: integer
        rd_deadline:
          description: Regular decision deadline
          examples:
            - "2023-01-01T00:00:00Z"
          format: date-time
          type: string
        school_location:
          description: Location of the college
          examples:
            - Cambridge, MA
          type: string
        school_name:
          description: Name of the college
          examples:
            - Harvard University
          type: string
        updated_at:
          description: Timestamp when the college was last updated
          examples:
            - "2023-01-01T00:00:00Z"
          format: date-time
          type: string
      required:
        - id
        - created_at
        - updated_at
        - school_name
        - school_location
      type: object
    GreetingMessageBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8081/schemas/GreetingMessageBody.json
          format: uri
          readOnly: true
          type: string
        greeting:
          description: Greeting message
          examples:
            - Hello, world!
          type: string
      required:
        - greeting
      type: object
    GreetingRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8081/schemas/GreetingRequestBody.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Name to greet
          examples:
            - world
          maxLength: 30
          type: string
      required:
        - name
      type: object
    PersonalCollegeApplication:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/PersonalCollegeApplication.json
          format: uri
          readOnly: true
          type: string
        application_type:
          description: "Which deadline the student is applying by: EA, ED, or RD"
          examples:
            - ED
          type: string
        category:
          description: "How the student categorizes this school: safety, target, or reach"
          examples:
            - reach
          type: string
        created_at:
          format: date-time
          type: string
        global_college_id:
          description: ID of the global college being applied to
          format: int64
          type: integer
        id:
          description: Unique identifier for the application
          format: int64
          type: integer
        student_id:
          description: ID of the student who owns this application
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - student_id
        - global_college_id
        - application_type
        - category
        - created_at
        - updated_at
      type: object
    PresignUploadRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/PresignUploadRequestBody.json
          format: uri
          readOnly: true
          type: string
        original_filename:
          description: The filename of the video about to be uploaded
          type: string
      required:
        - original_filename
      type: object
    PresignUploadResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/PresignUploadResponse.json
          format: uri
          readOnly: true
          type: string
        s3_key:
          description: The S3 key/path to store elsewhere, e.g. in a media table
          type: string
        upload_url:
          description: A presigned URL the client PUTs the raw video bytes to
          type: string
      required:
        - s3_key
        - upload_url
      type: object
    RefundEssayReviewResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/RefundEssayReviewResponseBody.json
          format: uri
          readOnly: true
          type: string
        refund:
          $ref: "#/components/schemas/EssayReviewTransaction"
          description: The negative row that reversed the charge
        transaction:
          $ref: "#/components/schemas/EssayReviewTransaction"
          description: The original charge, now marked refunded
      required:
        - transaction
        - refund
      type: object
    RequestEssayReviewRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/RequestEssayReviewRequestBody.json
          format: uri
          readOnly: true
          type: string
        amount:
          default: 1
          description: Number of review credits to spend. Positive; recorded on the ledger as a negative subtotal.
          examples:
            - 1
          format: int64
          minimum: 1
          type: integer
        essay_id:
          description: Essay to review
          examples:
            - b2c3d4e5-f6a7-4859-9a0b-1c2d3e4f5a6b
          type: string
        student_id:
          description: Student requesting the review
          examples:
            - 3f2b1a0c-9d8e-4c7b-8a6f-5e4d3c2b1a09
          type: string
      required:
        - student_id
        - essay_id
        - amount
      type: object
    SetStudentReviewBalanceRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/SetStudentReviewBalanceRequestBody.json
          format: uri
          readOnly: true
          type: string
        review_balance:
          description: Absolute value to set the student's review balance to
          examples:
            - 5
          format: int64
          minimum: 0
          type: integer
      required:
        - review_balance
      type: object
    Student:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/Student.json
          format: uri
          readOnly: true
          type: string
        counselor_id:
          type: string
        gpa:
          format: int64
          type: integer
        id:
          type: string
        organization:
          type:
            - string
            - "null"
        review_balance:
          format: int64
          type: integer
        user_id:
          type: string
        year:
          type: string
      required:
        - id
        - user_id
        - year
        - organization
        - gpa
        - review_balance
        - counselor_id
      type: object
    TodoItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/TodoItem.json
          format: uri
          readOnly: true
          type: string
        completed_at:
          format: date-time
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        deadline:
          format: date-time
          type:
            - string
            - "null"
        id:
          type: string
        student_id:
          type: string
        todo_description:
          type: string
        updated_at:
          format: date-time
          type: string
        user_id:
          type: string
      required:
        - id
        - created_at
        - updated_at
        - student_id
        - user_id
        - todo_description
        - completed_at
        - deadline
      type: object
    UpdateStatusBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/UpdateStatusBody.json
          format: uri
          readOnly: true
          type: string
        status:
          description: New status for the essay
          enum:
            - Submitted
            - Draft
            - Review
            - Archived
          type: string
      required:
        - status
      type: object
    UpdateTodoItemCompletedAtInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/UpdateTodoItemCompletedAtInputBody.json
          format: uri
          readOnly: true
          type: string
        completed:
          type: boolean
      required:
        - completed
      type: object
    User:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/User.json
          format: uri
          readOnly: true
          type: string
        id:
          type: string
        name:
          type: string
        needs_to_reset:
          type: boolean
        pfp_key:
          type:
            - string
            - "null"
        supabase_id:
          type: string
      required:
        - id
        - name
        - supabase_id
        - pfp_key
        - needs_to_reset
      type: object
    Video:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/Video.json
          format: uri
          readOnly: true
          type: string
        download_url:
          description: A presigned, time-limited URL for playback. Re-fetch this endpoint if the URL expires.
          type: string
        s3_key:
          description: The video's S3 object key/path, e.g. video-bucket/common-app-tips.mp4
          type: string
      required:
        - s3_key
        - download_url
      type: object
info:
  contact:
    name: Inspirate Consulting Team
  description: API for the Inspirate Consulting application
  title: Inspirate Consulting API
  version: 1.0.0
openapi: 3.1.0
paths:
  /applications:
    get:
      description: List all college applications for the authenticated student.
      operationId: list-personal-college-applications
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/PersonalCollegeApplication"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - Personal College Applications
    post:
      description: Create a personal college application for the authenticated student.
      operationId: create-personal-college-application
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonalCollegeApplicationRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalCollegeApplication"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - Personal College Applications
  /colleges:
    get:
      description: List all global colleges.
      operationId: list-global-colleges
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/GlobalCollege"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - Global Colleges
    post:
      description: Create a global college with a name, location, and optional EA/ED/RD deadlines.
      operationId: create-global-college
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGlobalCollegeRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalCollege"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - Global Colleges
  /colleges/{id}:
    get:
      description: Get a global college by ID.
      operationId: get-global-college
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalCollege"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - Global Colleges
  /essays:
    post:
      description: Creates an essay with the logged in student
      operationId: create-essay
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEssayBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - Essays
  /essays/{essay_id}/review-status:
    get:
      description: Get the current review status of an essay, from its most recent review request.
      operationId: get-essay-review-status
      parameters:
        - description: ID of the essay to look up
          in: path
          name: essay_id
          required: true
          schema:
            description: ID of the essay to look up
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EssayReviewStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      tags:
        - Essay Reviews
  /essays/{essay_id}/status:
    patch:
      description: updates the status of a students essay
      operationId: update-essay-status
      parameters:
        - description: Essay to update
          in: path
          name: essay_id
          required: true
          schema:
            description: Essay to update
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusBody"
        required: true
      responses:
        "204":
