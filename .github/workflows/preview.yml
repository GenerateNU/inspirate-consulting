# Per-PR backend preview on the shared droplet.
#
# A preview costs a container and a database -- RAM, not money -- so these run
# automatically on every PR with no label required.
name: Preview backend

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: droplet-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview backend
    runs-on: ubuntu-latest
    # Forked PRs cannot read secrets, so a deploy there would fail with a
    # misleading auth error.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4

      # GHCR repository names must be lowercase, but github.repository keeps the
      # org's capitalisation (GenerateNU), which buildx rejects outright.
      - name: Compute the image repository
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The default builder uses the `docker` driver, which cannot export the
      # GHA build cache below. Buildx switches to `docker-container`, which can.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}/backend:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the migration image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.migrate
          push: true
          tags: ${{ env.IMAGE_REPO }}/migrate:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The script is piped over stdin, so the droplet needs no checkout of
      # this repo and no scheduled sync to stay current.
      - name: Bring the preview up
        env:
          DROPLET: ${{ vars.DROPLET_USER }}@${{ vars.DROPLET_HOST }}
          PR: ${{ github.event.pull_request.number }}
          BACKEND_IMAGE: ${{ env.IMAGE_REPO }}/backend:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          MIGRATE_IMAGE: ${{ env.IMAGE_REPO }}/migrate:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
        run: |
          set -euo pipefail
          ssh "$DROPLET" bash -s -- "$PR" "$BACKEND_IMAGE" "$MIGRATE_IMAGE" < deploy/preview-up.sh

      - name: Comment the preview URL
        if: success()
        uses: actions/github-script@v7
        env:
          PREVIEW_HOST: pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}
        with:
          script: |
            const marker = '<!-- droplet-preview -->';
            const body = [
              marker,
              '### :rocket: Preview backend ready',
              '',
              `API: **https://${process.env.PREVIEW_HOST}**`,
              '',
              `Built from \`${context.payload.pull_request.head.sha.slice(0, 7)}\`.`,
              'It has its own database, migrated from this branch and isolated from every other PR.',
              'Auth comes from the preview Supabase project; production data is not reachable.',
              '',
              'Netlify comments its frontend preview separately. To point that frontend at',
              'this backend, set a deploy-preview `API_PROXY_TARGET` in Netlify.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- droplet-preview -->';
            const body = [
              marker,
              '### :x: Preview backend failed',
              '',
              `[View the logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
