name: frontend
on:
  pull_request:
    branches:
      - "main"
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Use Bun
        uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        working-directory: ./frontend
        run: bun install
      - name: Lint
        working-directory: ./frontend
        run: bun run lint
  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Use Bun
        uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        working-directory: ./frontend
        run: bun install
      - name: Type check
        working-directory: ./frontend
        run: bun run tsc --noEmit
      - name: Build
        working-directory: ./frontend
        run: bun run build
    
  orval_generate:
    runs-on: ubuntu-latest
    steps:
      - name: Use Bun
        uses: oven-sh/setup-bun@v1
 
      - name: Install dependencies
        working-directory: ./frontend
        run: bun install
 
      - name: Generate API client + schemas with Orval
        working-directory: frontend
        run: bunx orval
 
      - name: Check for stale generated client/schemas
        run: |
          git diff --exit-code \
            frontend/src/api/endpoints \
            frontend/src/api/models \
            frontend/src/api/schemas || \
          (echo "::error::Generated Orval output is out of date. Run 'npx orval' in frontend/ and commit." && exit 1)
